<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Formule Choice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
  body { background: #05060a; color: #e0e0e0; line-height: 1.5; }
  header { padding: 60px 20px 40px; text-align: center; }
  header h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; line-height: 1.1; }
  header h1 .cyan { color: #00f0ff; text-shadow: 0 0 20px #00f0ff88; }
  header h1 .pink { color: #ff2bd6; text-shadow: 0 0 20px #ff2bd688; }
  header p { margin-top: 15px; font-size: 0.9rem; letter-spacing: 2px; color: #888; text-transform: uppercase; }
  .nav-cats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px auto 40px; max-width: 900px; padding: 0 15px; }
  .nav-cats a { text-decoration: none; color: #ccc; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; border: 1px solid #00f0ff44; transition: 0.3s; background: #0a0e17; }
  .nav-cats a:hover { background: linear-gradient(90deg, #00f0ff, #ff2bd6); color: #000; border-color: transparent; box-shadow: 0 0 20px #00f0ff88; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
  .categorie { margin-bottom: 50px; }
  .categorie h2 { font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: #fff; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
  .categorie h2::before { content: ""; width: 40px; height: 3px; background: linear-gradient(90deg, #00f0ff, #ff2bd6); border-radius: 2px; }
  .categorie h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #ff2bd6, transparent); }
  .plats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .plat { background: #0a0e17; border: 1px solid #00f0ff55; border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; }
  .plat:hover { border-color: #ff2bd6; box-shadow: 0 0 25px #ff2bd644; transform: translate-stY(-3px); }
  .platars img { width: 100%; height: . 160px; object-fit: cover; backgroundstar: #111; display: block; }
  .:plat-body { padding: 15px;active display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .plat-body h3 { font-size: 0.95rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
  .plat-prix { font-size: 1.1rem; font-weight: 900; color: #00f0ff; text-shadow: 0 0 10px #00f0ff88; white-space: nowrap; }
  .plat-avg { font-size: 0.75rem; color: #ffd700; margin-top: 4px; letter-spacing: 1px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); justify-content: center; align-items: flex-end; z-index: 100; }
  .modal.show { display: flex; }
  .modal-wrapper { width: 100%; display: flex; justify-content: center; position: relative; }
  .modal-content { background: #0a0e17; border: 1px solid #ff2bd6; border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; position: relative; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-content img { width: 100%; height: 240px; object-fit: cover; display: block; }
  .modal-content video { width: 100%; max-height: 400px; display: block; background: #000; }
  .modal-body { padding: 25px; }
  .modal-body h2 { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  .modal-body .modal-prix { font-size: 1.5rem; font-weight: 900; color: #00f0ff; text-shadow: 0 0 15px #00f0ff88; margin-bottom: 20px; }
  .modal-body .label { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: #ff2bd6; margin-bottom: 8px; font-weight: 700; }
  .modal-body .desc { font-size: 0.95rem; color: #bbb; margin-bottom: 20px; line-height: 1.6; }
  .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; z-index: 10; }
  .rating-stars { display: flex; gap: 6px; font-size: 1.8rem; margin-bottom: 8px; }
  .rating-stars .star { cursor: pointer; color: #333; transition: 0.15s; user-select: none; }
  .rating-stars .star.filled { color: #ffd700; text-shadow: 0 0 12px #ffd70088; }
  .rating { transform: scale(1.3); }
  .rating-info { font-size: 0.8rem; color: #888; margin-bottom: 15px; letter-spacing: 1px; }
  .rating-info .avg { color: #ffd700; font-weight: 700; }
  .rating-thanks { color: #00f0ff; font-size: 0.85rem; margin-top: 8px; }
  footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; border-top: 1px solid #ff2bd622; }
  @media (max-width: 500px) {
    header h1 { font-size: 1.9rem; }
    .categorie h2 { font-size: 1.3rem; }
    .plats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .plat img { height: 120px; }
    .plat-body { padding: 10px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .plat-body h3 { font-size: 0.75rem; }
    .plat-prix { font-size: 0.9rem; }
    .rating-stars { font-size: 1.5rem; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1><span class="cyan">LA FORMULE</span><br><span class="pink">CHOICE</span></h1>
  <p>~ Notre Carte ~</p>
</header>

<div class="nav-cats" id="nav"></div>
<div class="container" id="carte"></div>
<footer>© 2025 La Formule Choice</footer>

<div class="modal" id="modal">
  <div class="modal-wrapper">
    <div class="modal-content">
      <img id="modal-img" src="" alt="">
      <video id="modal-video" controls playsinline style="display:none;"></video>
      <button class="modal-close" onclick="fermerModal()">X</button>
      <div class="modal-body">
        <h2 id="modal-nom"></h2>
        <div class="modal-prix" id="modal-prix"></div>
        <div class="label">Note</div>
        <div class="rating-stars" id="modal-stars"></div>
        <div class="rating-info" id="modal-rating-info"></div>
        <div class="rating-thanks" id="modal-thanks" style="display:none;">Merci pour votre vote !</div>
        <div class="label">Description</div>
        <div class="desc" id="modal-desc"></div>
        <div class="label">Composition</div>
        <div class="desc" id="modal-compo"></div>
      </div>
    </div>
  </div>
</div>

<script>
  var PLACEHOLDER = "https://placehold.co/600x400/0a0e17/00f0ff?text=Photo";
  var menu = [];
  var allRatings = {};
  var currentProductId = "";

  fetch('/menu.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      menu = data.categories || [];
      return fetch('/ratings');
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allRatings = data || {};
      afficherCarte();
    })
    .catch(function(err) {
      document.getElementById('carte').innerHTML = '<p style="text-align:center;color:#ff4444;padding:40px;">Erreur de chargement du menu.</p>';
    });

  function moyenneProduit(id) {
    if (allRatings[id] && allRatings[id].count > 0) {
      return {
        avg: (allRatings[id].total / allRatings[id].count).toFixed(1),
        count: allRatings[id].count
      };
    }
    return null;
  }

  function afficherCarte() {
    var nav = document.getElementById('nav');
    var carte = document.getElementById('carte');
    var navHtml = "";
    var i, j;

    for (i = 0; i < menu.length; i++) {
      navHtml += "<a href='#cat-" + i + "'>" + menu[i].nom + "</a>";
    }
    nav.innerHTML = navHtml;

    var carteHtml = "";
    for (i = 0; i < menu.length; i++) {
      var cat = menu[i];
      carteHtml += "<section class='categorie' id='cat-" + i + "'>";
      carteHtml += "<h2>" + cat.nom + "</h2>";
      carteHtml += "<div class='plats-grid'>";
      for (j = 0; j < cat.produits.length; j++) {
        var p = cat.produits[j];
        var imgSrc = p.img ? p.img : PLACEHOLDER;
        var prixAffiche = (p.prix !== undefined && p.prix !== null) ? Number(p.prix).toFixed(2) : "0.00";
        var moy = moyenneProduit(p.nom);
        var avgHtml = moy ? "<div class='plat-avg'>" + moy.avg + " / 5 (" + moy.count + ")</div>" : "";
        carteHtml += "<div class='plat' onclick='ouvrirModal(" + i + "," + j + ")'>";
        carteHtml += "<img src='" + imgSrc + "' alt='" + p.nom + "'>";
        carteHtml += "<div class='plat-body'>";
        carteHtml += "<h3>" + p.nom + "</h3>";
        carteHtml += "<div><div class='plat-prix'>" + prixAffiche + " EUR</div>" + avgHtml + "</div>";
        carteHtml += "</div></div>";
      }
      carteHtml += "</div></section>";
    }
    carte.innerHTML = carteHtml;
  }

  function renderStars(container, avg, interactive) {
    container.innerHTML = "";
    for (var s = 1; s <= 5; s++) {
      var span = document.createElement('span');
      span.className = 'star';
      span.textContent = '★';
      span.dataset.value = s;
      if (avg && s <= Math.round(avg)) {
        span.classList.add('filled');
      }
      if (interactive) {
        span.addEventListener('click', function(e) {
          var val = parseInt(e.target.dataset.value, 10);
          envoyerNote(val);
        });
      }
      container.appendChild(span);
    }
  }

  function ouvrirModal(i, j) {
    try {
      var p = menu[i].produits[j];
      var imgEl = document.getElementById('modal-img');
      var videoEl = document.getElementById('modal-video');

      var hasVideo = (p.video && p.video !== "" && p.video !== null && p.video !== undefined);

      if (hasVideo) {
        if (imgEl) imgEl.style.display = 'none';
        if (videoEl) {
          videoEl.style.display = 'block';
          videoEl.src = p.video;
          videoEl.poster = p.img ? p.img : PLACEHOLDER;
        }
      } else {
        if (videoEl) {
          videoEl.style.display = 'none';
          videoEl.removeAttribute('src');
        }
        if (imgEl) {
          imgEl.style.display = 'block';
          imgEl.src = p.img ? p.img : PLACEHOLDER;
        }
      }

      var prixAffiche = (p.prix !== undefined && p.prix !== null) ? Number(p.prix).toFixed(2) : "0.00";

      document.getElementById('modal-nom').textContent = p.nom || '';
      document.getElementById('modal-prix').textContent = prixAffiche + " EUR";
      document.getElementById('modal-desc').textContent = p.desc || '';
      document.getElementById('modal-compo').textContent = p.compo || '';

      currentProductId = p.nom;

      var moy = moyenneProduit(currentProductId);
      var avg = moy ? parseFloat(moy.avg) : 0;

      renderStars(document.getElementById('modal-stars'), avg, true);

      var infoEl = document.getElementById('modal-rating-info');
      if (moy) {
        infoEl.innerHTML = "Moyenne : <span class='avg'>" + moy.avg + " / 5</span> (" + moy.count + " vote" + (moy.count > 1 ? "s" : "") + ")";
      } else {
        infoEl.textContent = "Aucun vote pour le moment — soyez le premier !";
      }

      document.getElementById('modal-thanks').style.display = 'none';
      document.getElementById('modal').classList.add('show');
    } catch (e) {
      alert('Erreur : ' + e.message);
    }
  }

  function envoyerNote(stars) {
    fetch('/ratings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productId: currentProductId, stars: stars })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        allRatings[currentProductId] = {
          total: parseFloat(data.average) * data.count,
          count: data.count
        };
        renderStars(document.getElementById('modal-stars'), parseFloat(data.average), false);
        document.getElementById('modal-rating-info').innerHTML = "Moyenne : <span class='avg'>" + data.average + " / 5</span> (" + data.count + " vote" + (data.count > 1 ? "s" : "") + ")";
        document.getElementById('modal-thanks').style.display = 'block';
        afficherCarte();
      } else if (data.error === 'Deja vote') {
        alert('Vous avez deja vote pour ce produit.');
      } else {
        alert('Erreur lors du vote.');
      }
    })
    .catch(function() {
      alert('Erreur reseau.');
    });
  }

  function fermerModal() {
    document.getElementById('modal').classList.remove('show');
    var videoEl = document.getElementById('modal-video');
    if (videoEl) {
      videoEl.pause();
      videoEl.currentTime = 0;
    }
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target.id === 'modal') fermerModal();
  });
</script>

</body>
</html>
