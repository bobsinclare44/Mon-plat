<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Formule Choice - Notre Carte</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #faf7f2; color: #2b2b2b; line-height: 1.5; }
  header { background: linear-gradient(135deg, #1e1e1e, #3a3a3a); color: white; padding: 50px 20px; text-align: center; }
  header h1 { font-size: 2.3rem; letter-spacing: 2px; margin-bottom: 10px; }
  header p { opacity: 0.85; font-size: 1rem; font-style: italic; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  .nav-cats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; position: sticky; top: 0; background: #faf7f2; padding: 15px 0; z-index: 10; border-bottom: 1px solid #eee; }
  .nav-cats a { text-decoration: none; color: #555; padding: 8px 18px; border-radius: 25px; font-weight: 600; font-size: 0.9rem; transition: 0.2s; border: 1px solid transparent; }
  .nav-cats a:hover { background: #1e1e1e; color: white; }
  .categorie { margin-bottom: 50px; }
  .categorie h2 { font-size: 1.6rem; margin-bottom: 25px; color: #1e1e1e; padding-bottom: 10px; border-bottom: 2px solid #d4a574; display: inline-block; }
  .plat { display: flex; gap: 18px; padding: 18px 0; border-bottom: 1px dashed #e0d5c5; align-items: center; }
  .plat img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; flex-shrink: 0; background: #eee; }
  .plat-info { flex: 1; }
  .plat-info h3 { font-size: 1.15rem; margin-bottom: 4px; color: #1e1e1e; }
  .plat-info p { font-size: 0.9rem; color: #777; }
  .plat-prix { font-size: 1.2rem; font-weight: bold; color: #d4a574; white-space: nowrap; }
  footer { text-align: center; padding: 40px 20px; color: #999; font-size: 0.85rem; border-top: 1px solid #eee; margin-top: 30px; }
  @media (max-width: 500px) {
    header h1 { font-size: 1.8rem; }
    .plat img { width: 70px; height: 70px; }
    .plat-info h3 { font-size: 1rem; }
    .plat-prix { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>LA FORMULE CHOICE</h1>
  <p>~ Notre Carte ~</p>
</header>

<div class="nav-cats" id="nav"></div>
<div class="container" id="carte"></div>
<footer>© 2025 La Formule Choice — Tous droits réservés</footer>

<script>
  const menu = [
    {
      categorie: "Entrées",
      plats: [
        { nom: "Salade César", desc: "Poulet grillé, parmesan, croûtons", prix: 8.00, img: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=200" },
        { nom: "Soupe à l'oignon", desc: "Recette traditionnelle gratinée", prix: 6.50, img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=200" }
      ]
    },
    {
      categorie: "Burgers",
      plats: [
        { nom: "Burger Classique", desc: "Bœuf, cheddar, salade, tomate", prix: 9.50, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" },
        { nom: "Double Cheese", desc: "Double steak, double cheddar", prix: 12.00, img: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=200" }
      ]
    },
    {
      categorie: "Pizzas",
      plats: [
        { nom: "Margherita", desc: "Tomate, mozzarella, basilic", prix: 10.50, img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=200" },
        { nom: "4 Fromages", desc: "Mozza, chèvre, gorgonzola, emmental", prix: 13.00, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=200" }
      ]
    },
    {
      categorie: "Boissons",
      plats: [
        { nom: "Coca-Cola", desc: "33 cl bien frais", prix: 2.50, img: "https://images.unsplash.com/photo-1554866585-cd94860890b7?w=200" },
        { nom: "Café", desc: "Expresso ou allongé", prix: 2.00, img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200" }
      ]
    },
    {
      categorie: "Desserts",
      plats: [
        { nom: "Tiramisu", desc: "Recette italienne traditionnelle", prix: 5.50, img: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=200" }
      ]
    }
  ];

  const nav = document.getElementById("nav");
  const carte = document.getElementById("carte");
  nav.innerHTML = menu.map((cat, i) => `<a href="#cat-${i}">${cat.categorie}</a>`).join("");
  carte.innerHTML = menu.map((cat, i) => `
    <section class="categorie" id="cat-${i}">
      <h2>${cat.categorie}</h2>
      ${cat.plats.map(p => `
        <div class="plat">
          <img src="${p.img}" alt="${p.nom}" onerror="this.src='https://via.placeholder.com/200?text=?'">
          <div class="plat-info">
            <h3>${p.nom}</h3>
            <p>${p.desc}</p>
          </div>
          <div class="plat-prix">${p.prix.toFixed(2)} €</div>
        </div>
      `).join("")}
    </section>
  `).join("");
</script>

</body>
</html>
